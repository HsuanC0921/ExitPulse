name: exitpulse

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exitpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請於 .env 設定強密碼}
      POSTGRES_DB: ${POSTGRES_DB:-exitpulse}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - exitpulse-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exitpulse} -d ${POSTGRES_DB:-exitpulse}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      PGHOST: db
      # 預設沿用擁有者帳號。執行 deploy/create-readonly-role.sh 後 .env 會有唯讀角色，API 就自動改用它
      PGUSER: ${EXITPULSE_API_USER:-${POSTGRES_USER:-exitpulse}}
      PGDATABASE: ${POSTGRES_DB:-exitpulse}
      PGPASSWORD: ${EXITPULSE_API_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
      EXITPULSE_WORKERS: ${EXITPULSE_WORKERS:-2}
      EXITPULSE_PLACES_ENDPOINT: ${EXITPULSE_PLACES_ENDPOINT:-https://photon.komoot.io/api/}
      EXITPULSE_DOCS: "0"
      EXITPULSE_RATE_PER_MINUTE: ${EXITPULSE_RATE_PER_MINUTE:-240}
      EXITPULSE_RATE_BURST: ${EXITPULSE_RATE_BURST:-80}
    # 容器加固：以非 root 身分執行（見 Dockerfile.api）、拿掉所有 Linux capability、禁止提權
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  init:
    profiles: ["init"]
    # 匯入工具要寫入掛載進來的 data 與發布目錄，沿用 root 並補回讀寫他人檔案所需的最小 capability
    user: root
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-exitpulse}
      PGDATABASE: ${POSTGRES_DB:-exitpulse}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EXITPULSE_DATABASE_URL: postgresql://${POSTGRES_USER:-exitpulse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-exitpulse}
      EXITPULSE_DEFAULT_JSON: /srv/web/current/od/default.json
      EXITPULSE_METRO_SYNC_DIR: /srv/web/current/metro
    volumes:
      - ../data:/app/data
      - ${EXITPULSE_WEB_RELEASES:-/srv/exitpulse/releases}:/srv/web
    entrypoint: ["python", "-u", "tools/setup.py"]
    command: ["--jobs", "1"]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
    ports:
      - "127.0.0.1:${EXITPULSE_WEB_PORT:-5080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${EXITPULSE_WEB_RELEASES:-/srv/exitpulse/releases}:/srv/web:ro

volumes:
  exitpulse-pg18:
